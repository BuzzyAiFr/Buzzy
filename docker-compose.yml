version: '3.8'

services:
  ui:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
    ports:
      - "3000:3000"
    container_name: buzzy_ui

  agent-service:
    build:
      context: .
      dockerfile: packages/agent-service/Dockerfile
    ports:
      - "3001:3000"
    container_name: buzzy_agent_service

  api-gateway:
    build:
      context: .
      dockerfile: packages/api-gateway/Dockerfile
    ports:
      - "3002:3001"
    container_name: buzzy_api_gateway
